<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse | Seu universo de entretenimento</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>🎬 CineVerse</h1>
        <p>Seu catálogo particular de filmes e séries</p>
    </header>

    <main>
        <section class="add-form search-section">
            <h2>🍿 Descubra e Escolha</h2>
            <p class="subtitle">Navegue por gêneros ou pesquise pelo nome:</p>
            
            <input type="text" id="stremio-search" placeholder="Pesquisar filme ou série...">
            
            <div id="filtros-generos" class="filtros-container">
                <button class="btn-filtro ativo" onclick="carregarPorGenero('movie', 'top', this)">🔥 Populares (Filmes)</button>
                <button class="btn-filtro" onclick="carregarPorGenero('movie', 'Action', this)">💥 Ação</button>
                <button class="btn-filtro" onclick="carregarPorGenero('movie', 'Comedy', this)">😂 Comédia</button>
                <button class="btn-filtro" onclick="carregarPorGenero('movie', 'Horror', this)">👻 Terror</button>
                <button class="btn-filtro" onclick="carregarPorGenero('movie', 'Romance', this)">❤️ Romance</button>
                <button class="btn-filtro" onclick="carregarPorGenero('movie', 'Sci-Fi', this)">🚀 Ficção</button>
                <button class="btn-filtro" onclick="carregarPorGenero('series', 'top', this)">📺 Populares (Séries)</button>
            </div>

            <div id="stremio-resultados" class="grid-container"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button id="btn-carregar-mais" class="btn-load-more" onclick="carregarMais()">Carregar Mais</button>
            </div>
        </section>

        <section class="add-form">
            <h2>Adicionar Título ao Catálogo</h2>
            <form id="movie-form">
                <input type="hidden" id="capa_url">
                
                <input type="text" id="titulo" placeholder="Nome do filme/série" required>
                <input type="text" id="genero" placeholder="Gênero (ex: Terror)" required>
                <input type="number" id="ano" placeholder="Ano (ex: 2023)" required>
                
                <select id="tipo">
                    <option value="Filme">Filme</option>
                    <option value="Série">Série</option>
                </select>
                
                <select id="status">
                    <option value="Quero assistir">Quero assistir</option>
                    <option value="Assistindo">Assistindo</option>
                    <option value="Já assisti">Já assisti</option>
                </select>

                <input type="number" id="nota" placeholder="Nota (0 a 10)" min="0" max="10">
                <input type="text" id="comentario" placeholder="Comentário (opcional)">
                
                <button type="submit">Adicionar</button>
            </form>
        </section>

        <section id="catalogo">
            <div class="catalogo-header">
                <h2>Meu Catálogo</h2>
                <button id="btn-aleatorio" class="btn-random">🎲 Sortear para assistir</button>
            </div>
            <div id="lista-filmes" class="grid-container"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
